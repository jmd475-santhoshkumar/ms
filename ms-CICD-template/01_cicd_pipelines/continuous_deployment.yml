parameters:
  - name: poolName
    type: string
    default: "JMAN"

  - name: workspaceVariableGroup
    type: string

  - name: servicePrincipalVariableGroup
    type: string


jobs:


  # This job validates the variable group passed to the pipeline for the workspace details.
  - job: workspace_variable_group_validation
    pool:
      name: ${{ parameters.poolName }}
    variables:
      - group: ${{ parameters.workspaceVariableGroup }}
    steps:
      - checkout: none
      - powershell: |
          Write-Host "Validating if the correct Variable Group is passed for the Repo..."

          $workspace_variable_group = "${{ parameters.workspaceVariableGroup }}"
          $source_repo = "$(Build.Repository.Name)"

          if ($workspace_variable_group -like "$source_repo*") {
            Write-Host "OK Correct Variable Group '$workspace_variable_group' is passed for the repository '$source_repo'"
          } else {
            Write-Host "FAILED Incorrect Variable Group '$workspace_variable_group' is passed for the repository '$source_repo'"
            Write-Host "Expected Variable Group name to exactly match the repository name '$source_repo'"
            Write-Host "##vso[task.complete result=Failed;]Variable Group validation failed"
            exit 1
          }
        name: validate_workspace_variable_group


  # This job identifies the branch from which the PR is raised or the branch to which the commit is made and maps it to the corresponding workspace details using the variable group.
  - job: branch_identification
    pool:
      name: ${{ parameters.poolName }}
    dependsOn: workspace_variable_group_validation
    variables:
      - group: ${{ parameters.workspaceVariableGroup }}
    steps:
      - checkout: none
      - powershell: |
          Write-Host "Identifying Current Branch..."

          $current_branch = "$(Build.SourceBranch)".Replace("refs/heads/", "")
          Write-Host "Current Branch: $current_branch"

          # Map Branches to the workspaceId from the variable group
          $workspace_id = ""
          $workspace_name = ""
          $environment = ""

          switch($current_branch){
            "dev" {
              Write-Host "OK Current branch '$current_branch' is identified as DEV environment"
              $workspace_id = "$(DEV_WORKSPACE_ID)"
              $workspace_name = "$(DEV_WORKSPACE_NAME)"
              $environment = "DEV"
              }
            "main" {
                Write-Host "OK Current branch '$current_branch' is identified as PROD environment"
                $workspace_id = "$(PROD_WORKSPACE_ID)"
                $workspace_name = "$(PROD_WORKSPACE_NAME)"
                $environment = "PROD"
              }
            default {
                Write-Host "FAILED Current branch '$current_branch' is not recognized for deployment"
                Write-Host "##vso[task.complete result=Failed;]Branch identification failed"
                exit 1
              }
            }

          Write-Host "Workspace ID: $workspace_id"
          Write-Host "Workspace Name: $workspace_name"
          Write-Host "Environment: $environment"

          Write-Host "##vso[task.setvariable variable=workspaceId;isOutput=true]$workspace_id"
          Write-Host "##vso[task.setvariable variable=workspaceName;isOutput=true]$workspace_name"
          Write-Host "##vso[task.setvariable variable=environment;isOutput=true]$environment"
        name: setWorkspaceDetails


