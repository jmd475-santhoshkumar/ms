  #         Write-Host "======================================"
  #         Write-Host "Workspace ID   : $(workspaceId)"
  #         Write-Host "Workspace Name : $(workspaceName)"
  #         Write-Host ""

  #         $scripts_dir = "$(Pipeline.Workspace)\cicd_templates\02_workspace_validation_script"

  #         Write-Host "--- Python setup ---"
  #         py -3.11 --version
  #         py -3.11 -m pip install --upgrade pip --quiet
  #         py -3.11 -m pip install requests --quiet
  #         Write-Host "OK Dependencies installed"
  #         Write-Host ""

  #         Write-Host "--- Running workspace validation script ---"
  #         py -3.11 "$scripts_dir\workspace_validation.py" `
  #           --workspace_id "$(workspaceId)" `
  #           --workspace_name "$(workspaceName)"

  #         if ($LASTEXITCODE -ne 0) {
  #             Write-Host "##vso[task.logissue type=error]Workspace validation failed with exit code $LASTEXITCODE"
  #             exit 1
  #         }

  #         Write-Host "OK Workspace validation passed"
  #         Write-Host "======================================"
  #       displayName: 'Run Workspace Validation Script'
  #       env:
  #         AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
  #         AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
  #         AZURE_TENANT_ID: $(AZURE_TENANT_ID)
  #       name: validate_workspace


  # This job displays the deployment details like workspace name, workspace id and environment which are identified and validated in the previous steps.
  - job: display_deployment_details
    pool:
      name: ${{ parameters.poolName }}
    dependsOn:
      - branch_identification
    variables:
      - name: workspaceId
        value: $[ dependencies.branch_identification.outputs['setWorkspaceDetails.workspaceId'] ]
      - name: environment
        value: $[ dependencies.branch_identification.outputs['setWorkspaceDetails.environment'] ]
      - name: workspaceName
        value: $[ dependencies.branch_identification.outputs['setWorkspaceDetails.workspaceName'] ]
    steps:
      - checkout: none
      - powershell: |
          Write-Host "Deployment Details:"
          Write-Host "Workspace ID: $(workspaceId)"
          Write-Host "Workspace Name: $(workspaceName)"
          Write-Host "Environment: $(environment)"
        name: display_details


  # This job deploys the changes to the fabric workspace using the deployment scripts present in the repository.
  - job: deploy_to_fabric_workspace
    pool:
      name: ${{ parameters.poolName }}
    dependsOn:
      - branch_identification
      - display_deployment_details
    variables:
      - group: ${{ parameters.servicePrincipalVariableGroup }}
      - name: workspaceId
        value: $[ dependencies.branch_identification.outputs['setWorkspaceDetails.workspaceId'] ]
      - name: environment
        value: $[ dependencies.branch_identification.outputs['setWorkspaceDetails.environment'] ]
      - name: workspaceName
        value: $[ dependencies.branch_identification.outputs['setWorkspaceDetails.workspaceName'] ]
    steps:
      - powershell: |
          Write-Host "Setting PowerShell execution policy to Bypass..."
          Set-ExecutionPolicy Bypass -Scope Process -Force
          Write-Host "OK Execution policy set successfully"
        displayName: "Fix PowerShell Execution Policy"

      # Checkout the source repo (the data repo, e.g. ws-ms-analytics) - contains Fabric items and deployment scripts
      - checkout: self

      - powershell: |
          Write-Host "======================================"
          Write-Host "FABRIC WORKSPACE DEPLOYMENT"
          Write-Host "======================================"
          Write-Host "Timestamp        : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "Agent            : $(Agent.Name)"
          Write-Host "Build ID         : $(Build.BuildId)"
          Write-Host ""

          $repo_dir     = "$(Build.SourcesDirectory)"
          $scripts_dir  = "$(Build.SourcesDirectory)\02_deployment_scripts"
          $workspace_id = "$(workspaceId)"
          $environment  = "$(environment)"

          Write-Host "Environment      : $environment"
          Write-Host "Workspace ID     : $workspace_id"
          Write-Host "Workspace Name   : $(workspaceName)"
          Write-Host "Repo Directory   : $repo_dir"
          Write-Host "Scripts Dir      : $scripts_dir"
          Write-Host ""

          Write-Host "--- Validating inputs ---"
          if ([string]::IsNullOrWhiteSpace($workspace_id)) {
              Write-Host "##vso[task.logissue type=error]Workspace ID is empty. Cannot proceed with deployment."
              exit 1
          }
          Write-Host "  Workspace ID   : OK"

          if (-Not (Test-Path -Path $repo_dir)) {
              Write-Host "##vso[task.logissue type=error]Repository directory '$repo_dir' does not exist."
              exit 1
          }
          Write-Host "  Repo directory : OK"

          if (-Not (Test-Path -Path $scripts_dir)) {
              Write-Host "##vso[task.logissue type=error]Scripts directory '$scripts_dir' does not exist."
              exit 1
          }
          Write-Host "  Scripts dir    : OK"
          Write-Host ""

          Write-Host "===== DEBUG ====="

          Write-Host "PATH:"
          $env:PATH

          Write-Host "Python exists:"
          Test-Path "C:\Program Files\Python312\python.exe"

          Write-Host "Run Python directly:"
          & "C:\Program Files\Python312\python.exe" --version

          Write-Host "Run pip:"
          & "C:\Program Files\Python312\python.exe" -m pip --version

          Write-Host "Exit Code: $LASTEXITCODE"

          Write-Host "===== END DEBUG ====="

          Write-Host "--- Python setup ---"
          $PythonExe = "C:\Program Files\Python312\python.exe"

          Write-Host "===== Python Debug ====="
          where.exe python
          where.exe py

          python --version
          py -0p

          Get-Command python
          Get-Command py

          $env:PATH

          Write-Host "========================"

          & $PythonExe --version
          Write-Host "Upgrading pip..."
          & $PythonExe -m pip install --upgrade pip
          Write-Host ""
          Write-Host "Installing dependencies..."
          & $PythonExe -m pip install -r "$scripts_dir\requirements.txt"
          Write-Host "OK Dependencies installed"
          Write-Host ""

          Write-Host "--- Running deployment script ---"
          Write-Host "  --repo_dir     $repo_dir"
          Write-Host "  --workspace_id $workspace_id"
          Write-Host "  --environment  $environment"
          Write-Host ""

          & $PythonExe "$scripts_dir\deploy.py" `
            --repo_dir $repo_dir `
            --workspace_id $workspace_id `
            --environment $environment

          if ($LASTEXITCODE -ne 0) {
              Write-Host "##vso[task.logissue type=error]Deployment failed with exit code $LASTEXITCODE"
              exit 1
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "DEPLOYMENT SUCCESS"
          Write-Host "  Environment    : $environment"
          Write-Host "  Workspace      : $workspace_id"
          Write-Host "  Completed at   : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "======================================"

        displayName: 'Run Fabric Workspace Deployment Script'
        env:
          AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
          AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
          AZURE_TENANT_ID: $(AZURE_TENANT_ID)
        name: deploy_fabric_workspace
